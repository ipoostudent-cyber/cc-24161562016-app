services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: latihan
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: cc-24161562016-app:1.0
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://app:latihan@db:5432/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: